# Replace existing /etc/nginx/sites-available/iradios-stage only after backup.
server {
    listen 80;
    server_name stage.iradios.gr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://stage.iradios.gr$request_uri; }
}

server {
    listen 443 ssl;
    server_name stage.iradios.gr;
    ssl_certificate /etc/letsencrypt/live/stage.iradios.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.iradios.gr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "iRadiosGR Private Stage";
    auth_basic_user_file /etc/nginx/.iradios-stage.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 30m;

    location = /sitemap.xml { return 404; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location ^~ /media/ {
        alias /srv/iradios/staging/uploads/;
        autoindex off;
    }

    location ^~ /dev/mail/ {
        proxy_pass http://127.0.0.1:5525;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5511;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:5510;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
