server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ενεργοποίηση GZIP συμπίεσης για να φορτώνει αστραπιαία!
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Το μαγικό κόλπο για τα PWAs (React Router)
    # Brand SVG must never fall through to SPA index.html or lose its MIME type.
    location ~ ^/(icon-tr|iradios-app-logo|noicon-iradios-app-logo)\\.svg$ {
        types { image/svg+xml svg; }
        default_type image/svg+xml;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
