name: iradios_stage
services:
  mongo:
    image: mongo:9.0.4-resolute
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${STAGE_MONGO_PASSWORD:?create stage compose.env}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username root --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s
    mem_limit: 1800m

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: /dev/mail/
      MP_MAX_MESSAGES: 500
    ports:
      - '127.0.0.1:5525:8025'
    networks: [internal]
    mem_limit: 256m

  backend:
    build:
      context: ./backend
      args:
        IRADIOS_SITE_ORIGIN: https://stage.iradios.gr
    restart: unless-stopped
    env_file:
      - /etc/iradios/staging/backend.env
    environment:
      MONGO_URI: 'mongodb://root:${STAGE_MONGO_PASSWORD:?missing}@mongo:27017/iradios_stage?authSource=admin'
      APP_ENV: staging
      FRONTEND_URL: https://stage.iradios.gr
    depends_on:
      mongo: {condition: service_healthy}
      mailpit: {condition: service_started}
    ports:
      - '127.0.0.1:5511:5011'
    volumes:
      - ../uploads:/app/uploads
    networks: [internal]
    mem_limit: 1400m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5011/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 75s

  frontend:
    build:
      context: ./frontend
      args:
        IRADIOS_SITE_ORIGIN: https://stage.iradios.gr
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        VITE_STRIPE_PUBLISHABLE_KEY: ''
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - '127.0.0.1:5510:80'
    networks: [internal]
    mem_limit: 256m

volumes:
  mongo_data:
    name: iradios_stage_mongo_data
networks:
  internal:
    name: iradios_stage_internal
