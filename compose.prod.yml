name: iradios_prod
services:
  mongo:
    image: mongo:9.0.4-resolute
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${PROD_MONGO_PASSWORD:?set /etc/iradios/production/compose.env}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username root --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s
    mem_limit: 1800m

  backend:
    build:
      context: ./backend
      args:
        IRADIOS_SITE_ORIGIN: https://play.iradios.gr
    restart: unless-stopped
    env_file:
      - /etc/iradios/production/backend.env
    environment:
      MONGO_URI: 'mongodb://iradios_prod_app:${PROD_MONGO_APP_PASSWORD:?configure production Mongo user}@mongo:27017/iradios_prod?authSource=iradios_prod'
      APP_ENV: production
      TZ: Europe/Athens
      FRONTEND_URL: https://play.iradios.gr
    depends_on:
      mongo: {condition: service_healthy}
    ports:
      - '127.0.0.1:5611:5011'
    volumes:
      - ../uploads:/app/uploads
    networks: [internal]
    mem_limit: 1400m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5011/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 75s

  frontend:
    build:
      context: ./frontend
      args:
        IRADIOS_SITE_ORIGIN: https://play.iradios.gr
        VITE_APP_ENV: production
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - '127.0.0.1:5610:80'
    networks: [internal]
    mem_limit: 256m

volumes:
  mongo_data:
    name: iradios_prod_mongo_data
networks:
  internal:
    name: iradios_prod_internal
