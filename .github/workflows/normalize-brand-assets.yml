name: Build browser-safe iRadios logos
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/normalize-brand-assets.yml'
      - 'frontend/scripts/normalize-brand-assets.py'
      - 'frontend/public/brand-source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalized-branding-staging
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'ilumadigital/iRadiosGR' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG rendering and path tracing tools
        run: python -m pip install 'cairosvg==2.8.2' 'opencv-python-headless==4.11.0.86' 'Pillow==11.3.0'
      - name: Generate clean vectors and transparent PNG fallbacks
        run: python frontend/scripts/normalize-brand-assets.py
      - name: Validate derived assets are nonempty and script-free
        run: |
          for asset in icon-tr iradios-app-logo noicon-iradios-app-logo; do
            test -s "frontend/public/${asset}.svg"
            ! grep -Eq '<image|data:image|<script' "frontend/public/${asset}.svg"
          done
          for asset in icon wordmark full; do
            test -s "frontend/public/brand/${asset}.png"
            file "frontend/public/brand/${asset}.png" | grep -q 'PNG image data'
          done
      - name: Commit and push generated assets to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/icon-tr.svg frontend/public/iradios-app-logo.svg frontend/public/noicon-iradios-app-logo.svg frontend/public/brand/*.png
          if git diff --cached --quiet; then
            echo "Brand assets already current."
          else
            git commit -m "Generate portable SVG and transparent PNG logo assets"
            git push origin HEAD:staging
          fi
